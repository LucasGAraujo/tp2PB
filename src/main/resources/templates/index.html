<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema CRUD</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header>
    <h1>CRUD de Sistema</h1>
    <hr />
</header>

<main>
    <h2>Bem-vindo ao Sistema</h2>

    <!-- Botão para gerenciar usuários -->
    <form action="/users" method="get" style="display:inline;">
        <button type="submit">Gerenciar Usuários</button>
    </form>

    <!-- Botão para gerenciar produtos -->
    <form action="/produtos" method="get" style="display:inline;">
        <button type="submit">Gerenciar Produtos</button>
    </form>
</main>

<footer>
    <hr />
    <p>© 2025 - Sistema CRUD</p>
</footer>
</body>
</html>
