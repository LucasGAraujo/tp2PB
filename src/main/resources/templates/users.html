<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Lista de Usuários</title>
        <link rel="stylesheet" type="text/css" href="/style.css">
    </head>
    <body>
        <h2>Usuários</h2>
        <a href="/users/new">Novo Usuário</a>
        <table border="1">
            <tr>
                <th>ID</th><th>Nome</th><th>Email</th><th>Ações</th>
            </tr>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <a th:href="@{/users/edit/{id}(id=${user.id})}">Editar</a>
                    <a th:href="@{/users/delete/{id}(id=${user.id})}">Excluir</a>
                </td>
            </tr>
        </table>
    </body>
</html>
