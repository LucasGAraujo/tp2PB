name: CD Pipeline (Multi-Env + OIDC)

on:
  push:
    branches:
      - tp5
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:

  deploy-dev:
    if: github.ref == 'refs/heads/tp5'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: http://dev.localhost:7929

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'gradle' }

      - run: chmod +x gradlew

      - name: Build da Aplicação
        run: ./gradlew clean build -x test --no-daemon

      - name: Simular Deploy em DEV
        run: |
          echo "🚀 Iniciando deploy automático no ambiente de DESENVOLVIMENTO..."
          # Aqui entraria o comando real: docker push ou scp
          nohup java -jar build/libs/*.jar > app-dev.log 2>&1 &
          sleep 10 # Espera subir

      - name: Validação Pós-Deploy (Smoke Test)
        run: |
          echo "🩺 Executando testes rápidos de integridade em DEV..."
          curl -s http://localhost:7929 || exit 1
          echo "✅ Ambiente DEV está respondendo!"


  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://prod.localhost:7929

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'gradle' }


      - name: Autenticar na Nuvem (OIDC - AWS Example)

        run: |
          echo "🔐 Simulando troca de token OIDC com provedor de nuvem..."
          echo "✅ Autenticado via OpenID Connect (Assinatura JWT validada)"

      - run: chmod +x gradlew

      - name: Build para Produção
        run: ./gradlew clean build -x test --no-daemon

      - name: Deploy em Produção
        run: |
          echo "🚀 Executando Deploy Crítico em PRODUÇÃO..."
          # Simula subir a app em produção
          nohup java -jar build/libs/*.jar > app-prod.log 2>&1 &
          
          # Health Check (Garante que subiu antes de testar)
          echo "Aguardando aplicação subir..."
          for i in {1..12}; do
            curl -s http://localhost:7929 > /dev/null && break
            sleep 5
          done

      - name: Testes de Integridade em Produção (Selenium)
        run: ./gradlew seleniumTest
        env:
          TARGET_URL: "http://localhost:7929"