name: Pipeline Completo (CI/CD + Segurança + Aprovação)

on:
  push:
    branches: [ "main", "tp5" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:

  ci-build-security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissão ao Gradle
        run: chmod +x gradlew

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - name: Build e Testes com Gradle
        run: ./gradlew clean build --no-daemon

      - name: Finalizar Análise CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Salvar Artefato (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  cd-deploy-verify:
    needs: ci-build-security
    runs-on: ubuntu-latest

    environment:
      name: production
      url: http://localhost:7929

    steps:
      - name: Checkout (necessário para scripts de teste)
        uses: actions/checkout@v4

      - name: Configurar JDK e Chrome
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: browser-actions/setup-chrome@v1

      - name: Download do Artefato
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Preparar Permissões e Iniciar Aplicação
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ENV_TYPE: "production"
        run: |
          # 1. Resolve erro de permissão do ZAP docker
          chmod -R 777 .

          # 2. Inicia a aplicação na porta correta (7929)
          echo "Iniciando aplicação em background..."
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          
          # 3. Health Check: Aguarda até 60s pela porta 7929
          echo "Aguardando porta 7929..."
          APP_UP=false
          for i in {1..12}; do
            if curl -s http://localhost:7929 > /dev/null; then
              echo "✅ Aplicação subiu com sucesso na porta 7929!"
              APP_UP=true
              break
            fi
            echo "Tentativa $i: Aguardando..."
            sleep 5
          done

          # 4. Se falhar, mostra o log para debug
          if [ "$APP_UP" != "true" ]; then
            echo "❌ ERRO: A aplicação não respondeu na porta 7929."
            echo "--- LOG DA APLICAÇÃO ---"
            cat app.log
            echo "------------------------"
            exit 1
          fi

      - name: Executar Selenium (E2E)
        run: ./gradlew seleniumTest
        env:
          TARGET_URL: "http://localhost:7929"

      - name: OWASP ZAP - Scan Dinâmico
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:7929'
          cmd_options: '-u 0'