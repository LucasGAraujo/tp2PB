name: Pipeline Completo (CI/CD + Segurança + Aprovação)
on:
  push:
    branches: [ "main", "tp5" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ci-build-security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissão ao Gradle
        run: chmod +x gradlew
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build e Testes com Gradle
        run: ./gradlew build

      - name: Finalizar Análise CodeQL
        uses: github/codeql-action/analyze@v3
      - name: Salvar Artefato (JAR)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  cd-deploy-verify:
    needs: ci-build-security
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://localhost:8080

    steps:
      - name: Checkout (necessário para scripts de teste)
        uses: actions/checkout@v4

      - name: Configurar JDK e Chrome
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
      - uses: browser-actions/setup-chrome@v1
      - name: Download do Artefato
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Simular Deploy (Rodar app em background)
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ENV_TYPE: "production"
        run: |
          # Roda o JAR em background (&) para liberar o terminal para os testes
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          echo "Aguardando aplicação subir na porta 8080..."
          sleep 30 # Espera o Spring Boot/Java iniciar

      - name: Executar Selenium (E2E)
        run: ./gradlew seleniumTest
        env:
          TARGET_URL: "http://localhost:8080"

      - name: OWASP ZAP - Scan Dinâmico
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
