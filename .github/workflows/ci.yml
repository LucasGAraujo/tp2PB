name: Pipeline Completo (CI/CD)

on:
  push:
    branches: [ "main", "tp5" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:

  ci-build-security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Permissao ao Gradle
        run: chmod +x gradlew

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - name: Build e Testes
        run: ./gradlew clean build --no-daemon

      - name: Analise CodeQL
        uses: github/codeql-action/analyze@v3

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  cd-deploy-verify:
    needs: ci-build-security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    environment:
      name: production
      url: http://localhost:7929

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download do Artefato
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Iniciar Aplicacao
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          # Permissao para o ZAP (Docker) escrever relatorios
          chmod -R 777 .

          echo "Iniciando aplicacao..."
          nohup java -jar build/libs/*.jar > app.log 2>&1 &
          
          echo "Aguardando porta 7929..."
          APP_UP=false
          for i in {1..12}; do
            if curl -s http://localhost:7929 > /dev/null; then
              echo "Aplicacao subiu com sucesso!"
              APP_UP=true
              break
            fi
            sleep 5
          done

          if [ "$APP_UP" != "true" ]; then
            echo "Erro: Aplicacao nao respondeu."
            cat app.log
            exit 1
          fi

      - name: Testes Selenium
        run: ./gradlew seleniumTest
        env:
          TARGET_URL: "http://localhost:7929"

      - name: Scan OWASP ZAP
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:7929'
          artifact_name: 'zap-relatorio'
          allow_issue_writing: true